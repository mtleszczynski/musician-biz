app = 'musician-expenses-bot'
primary_region = 'lax'

[build]

[processes]
  worker = 'python main.py'

[mounts]
  source = 'bot_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  # Bumped from 256mb -> 512mb on 2026-05-18 after two OOM incidents on
  # legitimate 4MB phone photos. Even with all code-level mitigations in place
  # (image resize w/ draft mode, upfront preprocessing, semaphore, gc.collect,
  # Gemini timeouts), peak RSS during JPEG decode was consistently ~150MB,
  # right at the 256MB kernel OOM cliff. 512mb gives ~3x headroom for normal
  # use and absorbs multi-image messages without risk.
  memory = '512mb'
  auto_stop_machines = 'off'

[deploy]
  # Discord bot must have exactly 1 instance — multiple instances
  # cause duplicate message processing and race conditions.
  strategy = 'immediate'
